[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-sjc-vnindex-tvp-connectedness"
version = "0.1.0"
description = "TVP-VAR connectedness and robustness analysis for BTC, SJC gold, and VN-Index"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "scipy==1.18.0",
    "statsmodels==0.14.6",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4",
    "nbclient>=0.11",
    "nbformat>=5.10",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
